<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GENEFIC Cloudworks</title>
    <link rel="icon" type="image/x-icon" href="assets/logo.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/forms.css">
    <link rel="stylesheet" href="css/components/toast.css">
    <style>
        .app-layout { display: flex; flex-direction: column; min-height: 100vh; }
        @media (min-width: 1024px) {
            .app-layout { flex-direction: row; }
            .sidebar { width: 80px; height: 100vh; position: sticky; top: 0; align-items: center; }
            .sidebar:hover { width: 260px; }
            .sidebar .nav-text { display: none; }
            .sidebar:hover .nav-text { display: inline; }
            .sidebar .logo-text { display: none; }
            .sidebar:hover .logo-text { display: inline; }
        }
        .sidebar { background: var(--color-surface); padding: 24px 16px; border-right: 1px solid var(--color-border); display: flex; flex-direction: column; transition: width 0.3s var(--transition); z-index: 1001; }
        .main-content { flex: 1; padding: 32px 0; }
        .nav-link { 
            display: flex; align-items: center; gap: 16px; padding: 12px; 
            border-radius: 10px; text-decoration: none; color: var(--color-text-secondary);
            transition: var(--transition); justify-content: center;
        }
        .sidebar:hover .nav-link { justify-content: flex-start; }
        .nav-link:hover, .nav-link--active { background: var(--color-primary); color: white; }
        
        .result-grid { display: grid; grid-template-columns: 1fr; gap: 24px; margin-top: 32px; }
        @media (min-width: 768px) { .result-grid { grid-template-columns: 300px 1fr; } }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar glass-panel" style="border-radius: 0;">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 40px; justify-content: center;">
                <img src="assets/logo.png" alt="Logo" style="height: 32px;">
                <span class="logo-text" style="font-weight: 800; color: var(--color-primary);">GENEFIC</span>
            </div>
            <nav style="flex: 1; width: 100%;">
                <a href="#" class="nav-link nav-link--active" title="Dashboard"><i class="fa-solid fa-house"></i> <span class="nav-text">Dashboard</span></a>
                <a href="#" class="nav-link" title="Projetos"><i class="fa-solid fa-folder"></i> <span class="nav-text">Projetos</span></a>
                <button class="nav-link" data-theme-toggle style="background:none; border:none; width:100%; cursor:pointer;" title="Alternar Tema">
                    <i class="fa-solid fa-circle-half-stroke"></i> <span class="nav-text">Tema</span>
                </button>
            </nav>
            <button class="btn btn--outline btn--icon" id="logout-btn" title="Sair"><i class="fa-solid fa-power-off"></i></button>
        </aside>

        <main class="main-content">
            <div class="section-container">
                <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
                    <h1 style="font-size: 1.8rem; margin: 0;">Olá, <span id="user-display">Dev</span></h1>
                    <div class="glass-panel" style="padding: 8px 16px; font-size: 0.8rem; font-weight: bold; color: var(--color-primary);">PRO</div>
                </header>

                <section class="glass-panel" style="padding: 24px; text-align: center;">
                    <div style="display: flex; gap: 12px; max-width: 700px; margin: 0 auto;">
                        <input type="url" id="repo-url" class="form-input" placeholder="URL do Repositório GitHub" style="height: 48px; flex: 1;">
                        <button id="analyze-btn" class="btn btn--primary" style="height: 48px; width: 48px; padding: 0;" title="Analisar"><i class="fa-solid fa-bolt"></i></button>
                    </div>
                </section>

                <div id="results-area" style="display: none;">
                    <div class="result-grid">
                        <aside class="glass-panel" style="padding: 24px; text-align: center; align-self: start;">
                            <div style="font-size: 2.5rem; font-weight: 900; color: var(--color-primary);" id="tech-score-val">0</div>
                            <div style="font-size: 0.7rem; text-transform: uppercase; font-weight: 700; opacity: 0.6; margin-bottom: 16px;">Score</div>
                            <div id="stack-tags" style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;"></div>
                        </aside>

                        <div style="display: flex; flex-direction: column; gap: 20px;">
                            <div class="glass-panel" style="padding: 24px; border-left: 4px solid var(--color-primary); position: relative;">
                                <button class="btn btn--ghost btn--sm" style="position: absolute; top: 16px; right: 16px;" title="Copiar"><i class="fa-solid fa-copy"></i></button>
                                <h4 style="font-weight: 800; margin-bottom: 12px;"><i class="fa-solid fa-file-lines"></i> Narrativa Profissional</h4>
                                <div id="ats-result" style="font-size: 0.95rem; line-height: 1.6;"></div>
                            </div>
                            <div class="glass-panel" style="padding: 24px; border-left: 4px solid var(--color-secondary);">
                                <h4 style="font-weight: 800; margin-bottom: 12px;"><i class="fa-solid fa-lightbulb"></i> Insights</h4>
                                <ul id="suggestions-list" style="font-size: 0.9rem; padding-left: 20px; line-height: 1.6;"></ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/main.js"></script>
    <script type="module">
        import { AuthManager } from './js/auth.js';
        AuthManager.requireAuth();
        document.getElementById('logout-btn').addEventListener('click', () => AuthManager.logout());
    </script>
</body>
</html>
